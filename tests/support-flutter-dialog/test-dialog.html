<!doctype html><html lang="it"><meta charset="utf-8"><title>dōtapp · Dialog Flutter nativo</title><style>body{margin:0;background:#e9e4ee;color:#302637;font:14px system-ui;display:flex;justify-content:center;gap:22px;padding:16px}aside{width:260px}button,select{font:inherit;padding:10px;margin:4px 0}iframe{width:390px;height:844px;border:1px solid #cbbfd3;border-radius:18px;background:white}pre{white-space:pre-wrap;max-height:470px;overflow:auto;font-size:11px}output{display:block;margin:10px 0}</style><aside><h2>Dialog Flutter nativo</h2><p>Build compilata · solo tocchi sul vero IconButton</p><button id="start">PREPARA E APRI</button><p><label>Schermata <select id="section"><option>Home</option><option>Catalogo</option><option>Scorta</option><option>Lista spesa</option><option>Ricettario</option></select></label></p><button id="verify">VERIFICA DATI</button><output id="state" data-testid="state">Non avviata</output><output id="data" data-testid="data"></output><pre id="events" data-testid="events"></pre><pre id="proof" data-testid="proof"></pre></aside><iframe id="app" title="dōtapp reale" src="about:blank"></iframe><script>
const FIXTURE={"doterra_inventory_v2": "[{\"id\": \"a\", \"name\": \"Lavanda\", \"category\": \"Oli essenziali singoli\", \"stock\": 2, \"openedQuantity\": 1, \"openedDate\": \"2026-10-01\", \"quantitySet\": true, \"autoShoppingEnabled\": false, \"shoppingQuantity\": 2, \"notes\": \"Nota\", \"targetReserve\": 3}, {\"id\": \"b\", \"name\": \"Incenso\", \"category\": \"Oli essenziali singoli\", \"stock\": 0, \"quantitySet\": false, \"autoShoppingEnabled\": true}]", "oils_inventory_v1": "[{\"id\": \"old\", \"name\": \"Limone\", \"stock\": 3}]", "doterra_catalog_shopping_v1": "[{\"productId\": \"official:c\", \"name\": \"Cipresso\", \"category\": \"Oli\", \"unit\": \"15 ml\", \"quantity\": 3}]", "doterra_custom_products_v1": "[{\"id\": \"custom:test\", \"name\": \"Mia miscela\", \"aliases\": [\"Alias\"], \"note\": \"Privata\"}]", "doterra_personal_recipes_v1": "[{\"id\": \"r\", \"title\": \"Relax\", \"date\": \"2026-10-01\", \"purpose\": \"Utilizzo storico\", \"method\": \"Metodo storico\", \"ingredients\": [{\"oil\": \"Sconosciuto\", \"drops\": \"3\", \"topical\": \"true\", \"diffusion\": \"true\", \"internal\": \"false\"}], \"favorite\": true}]", "doterra_inventory_order_v1": "[\"b\", \"a\"]", "doterra_bottom_nav_order_v1": "[\"recipes\", \"scorta\", \"catalog\", \"shopping\"]", "doterra_app_messages_read_v1": "[1]", "DOTAPP_BACKUP_V1": "{\"format\": \"DOTAPP_BACKUP_V1\", \"version\": 1, \"createdAt\": \"2026-10-17T17:00:00Z\", \"data\": {\"doterra_inventory_v2\": \"[{\\\"id\\\": \\\"a\\\", \\\"name\\\": \\\"Lavanda\\\", \\\"category\\\": \\\"Oli essenziali singoli\\\", \\\"stock\\\": 2, \\\"openedQuantity\\\": 1, \\\"openedDate\\\": \\\"2026-10-01\\\", \\\"quantitySet\\\": true, \\\"autoShoppingEnabled\\\": false, \\\"shoppingQuantity\\\": 2, \\\"notes\\\": \\\"Nota\\\", \\\"targetReserve\\\": 3}, {\\\"id\\\": \\\"b\\\", \\\"name\\\": \\\"Incenso\\\", \\\"category\\\": \\\"Oli essenziali singoli\\\", \\\"stock\\\": 0, \\\"quantitySet\\\": false, \\\"autoShoppingEnabled\\\": true}]\", \"oils_inventory_v1\": \"[{\\\"id\\\": \\\"old\\\", \\\"name\\\": \\\"Limone\\\", \\\"stock\\\": 3}]\", \"doterra_catalog_shopping_v1\": \"[{\\\"productId\\\": \\\"official:c\\\", \\\"name\\\": \\\"Cipresso\\\", \\\"category\\\": \\\"Oli\\\", \\\"unit\\\": \\\"15 ml\\\", \\\"quantity\\\": 3}]\", \"doterra_custom_products_v1\": \"[{\\\"id\\\": \\\"custom:test\\\", \\\"name\\\": \\\"Mia miscela\\\", \\\"aliases\\\": [\\\"Alias\\\"], \\\"note\\\": \\\"Privata\\\"}]\", \"doterra_personal_recipes_v1\": \"[{\\\"id\\\": \\\"r\\\", \\\"title\\\": \\\"Relax\\\", \\\"date\\\": \\\"2026-10-01\\\", \\\"purpose\\\": \\\"Utilizzo storico\\\", \\\"method\\\": \\\"Metodo storico\\\", \\\"ingredients\\\": [{\\\"oil\\\": \\\"Sconosciuto\\\", \\\"drops\\\": \\\"3\\\", \\\"topical\\\": \\\"true\\\", \\\"diffusion\\\": \\\"true\\\", \\\"internal\\\": \\\"false\\\"}], \\\"favorite\\\": true}]\", \"doterra_inventory_order_v1\": \"[\\\"b\\\", \\\"a\\\"]\", \"doterra_bottom_nav_order_v1\": \"[\\\"recipes\\\", \\\"scorta\\\", \\\"catalog\\\", \\\"shopping\\\"]\", \"doterra_app_messages_read_v1\": \"[1]\"}}", "test_preference": "preferenza-fittizia-intatta"};const expected=new Map();const frame=document.getElementById('app');const events=[];let previousSupport=false,previousSettings=false;const dbName='dotapp-native-tap-fixture-v9';const idbValue={id:'preserved',value:'IndexedDB fittizio invariato',quantity:7};
function db(){return new Promise((resolve,reject)=>{const r=indexedDB.open(dbName,1);r.onupgradeneeded=()=>r.result.createObjectStore('fixture',{keyPath:'id'});r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});}
async function idbRead(){const d=await db();return await new Promise((resolve,reject)=>{const t=d.transaction('fixture','readonly');const r=t.objectStore('fixture').get('preserved');r.onsuccess=()=>{resolve(r.result);d.close()};r.onerror=()=>reject(r.error);});}
function allRoots(root){const roots=[root];for(const el of root.querySelectorAll('*'))if(el.shadowRoot)roots.push(...allRoots(el.shadowRoot));return roots;}
function observe(){const doc=frame.contentDocument;setInterval(()=>{const roots=allRoots(doc);const support=roots.some(root=>!!root.querySelector('[flt-semantics-identifier="dotapp-native-support-dialog"]'));const settings=!!doc.getElementById('scorta-settings-panel');if(support&&!previousSupport)events.push({section:document.getElementById('section').value,opened:'native-Flutter-dialog',settingsAlreadyOpen:settings});if(settings&&!previousSettings)events.push({section:document.getElementById('section').value,opened:'settings',supportAlsoOpen:support});previousSupport=support;previousSettings=settings;document.getElementById('state').textContent=roots.some(root=>root.querySelector('flt-semantics'))?`Dialog Flutter: ${support?'APERTO':'chiuso'} · Impostazioni: ${settings?'APERTE':'chiuse'} · Aperture: ${events.filter(x=>x.opened==='native-Flutter-dialog').length}`:'Collaudo visivo sul canvas Flutter';const json=JSON.stringify(events,null,2);if(document.getElementById('events').textContent!==json)document.getElementById('events').textContent=json;},100);}

frame.onload=()=>{if(frame.getAttribute('src')!=='about:blank')observe();};
document.getElementById('start').onclick=async()=>{if(location.hostname!=='terminal.local')throw Error('Harness restricted to local QA');frame.src='about:blank';for(const [key,value]of Object.entries(FIXTURE)){localStorage.setItem(key,value);expected.set(key,value);localStorage.setItem('flutter.'+key,JSON.stringify(value));expected.set('flutter.'+key,JSON.stringify(value));}localStorage.setItem('installation_intro_dismissed','true');localStorage.setItem('dotapp_news_seen_v1:2026.11.01.shop.1','1');const d=await db();await new Promise((resolve,reject)=>{const t=d.transaction('fixture','readwrite');t.objectStore('fixture').put(idbValue);t.oncomplete=()=>{d.close();resolve()};t.onerror=()=>reject(t.error);});events.length=0;previousSettings=previousSupport=false;document.getElementById('data').textContent=expected.size+' valori locali preparati + IndexedDB';frame.src='/';};
document.getElementById('verify').onclick=async()=>{const proof=[];for(const[key,value]of expected){const actual=localStorage.getItem(key);proof.push({key,identical:actual===value});}proof.push({key:'IndexedDB',identical:JSON.stringify(await idbRead())===JSON.stringify(idbValue)});document.getElementById('proof').textContent=JSON.stringify(proof,null,2);document.getElementById('data').textContent=proof.every(x=>x.identical)?`DATI PASS: ${proof.length}/${proof.length} identici`:'DATI FAIL';};
</script></html>
